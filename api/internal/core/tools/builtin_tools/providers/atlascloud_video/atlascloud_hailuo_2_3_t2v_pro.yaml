name: atlascloud_hailuo_2_3_t2v_pro
label: Hailuo 2.3 文生视频专业版
description: 使用 Atlas Cloud 的 Hailuo 2.3 Pro 生成高保真 1080p 视频，时长固定为 5 秒
params:
  - name: prompt
    label: 视频描述
    type: string
    required: true
  - name: width
    label: 输出宽度
    type: number
    default: 512
    min: 1
    max: 4096
    required: false
  - name: height
    label: 输出高度
    type: number
    default: 512
    min: 1
    max: 4096
    required: false
  - name: fps
    label: 视频帧率
    type: number
    default: 24
    min: 1
    max: 60
    required: false
