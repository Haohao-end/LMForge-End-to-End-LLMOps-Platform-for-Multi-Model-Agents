name: atlascloud_kling_video_o3_std_text_to_video
label: Kling O3 标准文生视频
description: 使用 Atlas Cloud 的 Kling O3 标准版生成高质量视频
params:
  - name: prompt
    label: 视频描述
    type: string
    required: true
  - name: duration
    label: 视频时长
    type: number
    default: 5
    min: 3
    max: 15
    required: false
  - name: aspect_ratio
    label: 视频比例
    type: select
    default: "16:9"
    required: false
    options:
      - value: "16:9"
        label: "16:9"
      - value: "9:16"
        label: "9:16"
      - value: "1:1"
        label: "1:1"
  - name: sound
    label: 同步音效
    type: boolean
    default: false
    required: false
