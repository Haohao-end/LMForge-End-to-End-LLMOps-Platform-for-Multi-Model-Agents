name: atlascloud_seedance_2_0_fast_image_to_video
label: Seedance 2.0 极速图生视频
description: 使用 Atlas Cloud 的 Seedance 2.0 Fast 以前帧和可选末帧快速生成视频
params:
  - name: prompt
    label: 视频描述
    type: string
    required: true
  - name: images
    label: 首帧图片URL
    type: string
    required: true
  - name: width
    label: 输出宽度
    type: number
    default: 512
    min: 1
    max: 4096
    required: false
  - name: height
    label: 输出高度
    type: number
    default: 512
    min: 1
    max: 4096
    required: false
  - name: duration
    label: 视频时长
    type: number
    default: 3
    min: 1
    max: 15
    required: false
  - name: fps
    label: 视频帧率
    type: number
    default: 24
    min: 1
    max: 60
    required: false
